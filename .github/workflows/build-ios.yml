name: Build & Submit iOS (Free Cloud Mac Runner)

on:
  workflow_dispatch: # Allows you to trigger the build with 1 click from GitHub Actions UI

jobs:
  build_and_submit:
    name: 🍎 iOS Production Build & App Store Submit
    runs-on: macos-14 # Apple Silicon macOS runner with Xcode 16.1 & complete iOS 18 SDK
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_DOCTOR: "1"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍏 Setup Xcode & iOS SDK
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: 🔧 Fix SwiftPM Compatibility for Expo Modules
        run: |
          node scripts/postinstall.js

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 🔨 Build iOS IPA (Free Local Xcode 16 Build)
        env:
          EXPO_DEBUG: "1"
          EAS_LOCAL_BUILD_WORKINGDIR: "/Users/runner/work/eas-build"
        run: |
          eas build --platform ios --profile production --local --non-interactive --output ./Orbit.ipa

      - name: 📤 Submit IPA to Apple App Store Connect
        run: |
          eas submit --platform ios --profile production --path ./Orbit.ipa --non-interactive

      - name: 🔍 Dump Detailed Xcode Build Logs on Failure
        if: failure()
        run: |
          python3 -c "
          import os
          for root in ['/Users/runner/Library/Logs', '/private/var/folders', '/tmp', '/Users/runner/work', '/Users/runner/.eas']:
              for dirpath, _, filenames in os.walk(root):
                  for f in filenames:
                      if (f.endswith('.log') or f.endswith('.txt') or 'gym' in f.lower()) and 'hca.log' not in f:
                          p = os.path.join(dirpath, f)
                          try:
                              if os.path.isfile(p) and os.path.getsize(p) > 0:
                                  with open(p, 'r', errors='ignore') as fp:
                                      lines = fp.readlines()
                                      err_indices = [i for i, l in enumerate(lines) if 'error:' in l.lower()]
                                      if err_indices:
                                          print('='*80)
                                          print('Logfile:', p, f'({len(lines)} lines, {len(err_indices)} errors)')
                                          print('='*80)
                                          for idx in err_indices[:30]:
                                              start = max(0, idx - 3)
                                              end = min(len(lines), idx + 6)
                                              print(f'--- Error at line {idx+1} ---')
                                              print(''.join(lines[start:end]))
                          except Exception:
                              pass
          "

