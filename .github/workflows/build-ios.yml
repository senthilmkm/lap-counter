name: Build & Submit iOS (Free Cloud Mac Runner)

on:
  workflow_dispatch: # Allows you to trigger the build with 1 click from GitHub Actions UI

jobs:
  build_and_submit:
    name: 🍎 iOS Production Build & App Store Submit
    runs-on: macos-15 # Apple Silicon macOS Sequoia runner with Xcode 16+
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_DOCTOR: "1"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 🔨 Build iOS IPA (Free Local Xcode 16 Build)
        run: |
          eas build --platform ios --profile production --local --non-interactive --output ./Orbit.ipa

      - name: 📤 Submit IPA to Apple App Store Connect
        run: |
          eas submit --platform ios --profile production --path ./Orbit.ipa --non-interactive
